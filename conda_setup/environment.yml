# The FMDV add-on's own env: every program its hooks and library build call,
# nothing borrowed from vsnp3's env. bdtools builds it at <checkout>/env and
# enforces the exact versions tools.yml pins for fmdv_addon (packages: [...]).
name: fmdv_addon
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - biopython
  - openpyxl
  - weasyprint
  - minimap2
  - samtools
  - seqkit
  - blast
  - mafft
  - raxml
  - iqtree
